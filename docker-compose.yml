# ============================================================
# CEWERS - Local Development Infrastructure
# PostgreSQL is installed NATIVELY (v18) — see .env DATABASE_URL.
# This compose file only provides Redis + MinIO (object storage).
# Run:  docker compose up -d      (or: pnpm db:up)
# ============================================================
services:
  redis:
    image: redis:7-alpine
    container_name: cewers-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cewers-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-cewers_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-cewers_minio_secret}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot container: creates the media bucket on first run
  minio-init:
    image: minio/mc:latest
    container_name: cewers-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ACCESS_KEY:-cewers_minio} ${MINIO_SECRET_KEY:-cewers_minio_secret};
      mc mb --ignore-existing local/${MINIO_BUCKET:-cewers-media};
      mc anonymous set download local/${MINIO_BUCKET:-cewers-media};
      echo 'Bucket ready.';
      "
    restart: "no"

volumes:
  redis_data:
  minio_data:
